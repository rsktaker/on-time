name: OnTime
options:
  bundleIdPrefix: com.rsktaker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OnTime:
    type: application
    platform: iOS
    sources:
      - path: OnTime
    info:
      path: OnTime/Info.plist
      properties:
        CFBundleDisplayName: On Time
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsUsageDescription: On Time reads your calendar events so it can schedule alarms before each meeting.
        NSCalendarsFullAccessUsageDescription: On Time reads your calendar events so it can schedule alarms before each meeting.
        LSApplicationQueriesSchemes:
          - shortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsktaker.ontime
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
